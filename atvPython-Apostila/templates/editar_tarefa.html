{% extends "base.html" %}
{% block titulo %}Editar Tarefa{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="mb-4"><i class="bi bi-pencil-square"></i> Editar Tarefa</h4>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Título</label>
                        <input type="text" name="titulo" class="form-control" value="{{ tarefa['titulo'] }}" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descrição</label>
                        <textarea name="descricao" class="form-control" rows="3">{{ tarefa['descricao'] }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="Pendente" {{ 'selected' if tarefa['status'] == 'Pendente' }}>Pendente</option>
                            <option value="Em andamento" {{ 'selected' if tarefa['status'] == 'Em andamento' }}>Em andamento</option>
                            <option value="Concluída" {{ 'selected' if tarefa['status'] == 'Concluída' }}>Concluída</option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar alterações</button>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
